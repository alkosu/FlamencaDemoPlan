<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4fd1">
<title>Flamenca Village · navegador</title>
<meta name="description" content="Interactive residence plan: find an apartment and get a walking route to its staircase and lift. EN · ES · FR · RU.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4fd1'/%3E%3Cpath d='M9 23V12l7-4 7 4v11h-5v-6h-4v6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="mode-simple">
<div class="wrap">
  <header class="top">
    <h1 id="apptitle">FlamencaDemoPlan</h1>
    <div class="ctrls">
      <div class="seg" id="modeseg" role="group" aria-label="Interface">
        <button type="button" data-v="simple">Simple</button>
        <button type="button" data-v="pro">Pro</button>
      </div>
      <select id="lang" aria-label="Language">
        <option value="es">ES · Español</option>
        <option value="en">EN · English</option>
        <option value="fr">FR · Français</option>
        <option value="ru">RU · Русский</option>
      </select>
    </div>
  </header>

  <div class="grid">
    <aside>
      <!-- Simple: номер квартиры крупно -->
      <form id="sform" class="simple-only" novalidate>
        <label class="lbl" for="num" data-i="aptNumber">Número de apartamento</label>
        <input id="num" class="bignum" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="search" placeholder="449" maxlength="8">
        <div class="err" id="err" role="alert" hidden></div>
      </form>

      <!-- Pro: поиск по коду с подсказками -->
      <div class="field pro-only">
        <label class="lbl" for="q" data-i="to">Destino</label>
        <input type="text" id="q" autocomplete="off" role="combobox" aria-controls="sugg" aria-expanded="false">
        <div class="sugg" id="sugg" role="listbox" hidden></div>
      </div>

      <div>
        <label class="lbl" for="from" data-i="from">Desde</label>
        <div class="row">
          <select id="from"></select>
          <button class="btn pro-only" id="pick" type="button" data-i="onMap">En el plano</button>
        </div>
      </div>

      <button class="btn primary simple-only" id="go" type="submit" form="sform" data-i="search">Buscar</button>

      <div class="pro-only">
        <span class="lbl" data-i="floorOnPlan">Planta en el plano</span>
        <div class="seg full" id="floorseg"></div>
      </div>
      <div class="pro-only">
        <span class="lbl" data-i="showWhich">Apartamentos visibles</span>
        <div class="seg full" id="showseg"></div>
      </div>

      <div class="card" id="info" aria-live="polite"></div>
    </aside>

    <div class="mapbox" id="mapbox">
      <svg id="map" viewBox="0 0 3112 2770" role="img" aria-label="Plan">
        <g id="world">
          <g data-layer="road"></g>
          <g data-layer="walk"></g>
          <g data-layer="lawn"></g>
          <g data-layer="pool"></g>
          <g data-layer="parking"></g>
          <g data-layer="bld"></g>
          <g data-layer="gallery"></g>
          <image data-layer="raster" x="0" y="0" opacity=".6"/>
          <g data-layer="apts" id="g-stacks"></g>
          <g data-layer="aptlabels" id="g-stl"></g>
          <g data-layer="pois"></g>
          <g data-layer="graph"></g>
          <g id="g-route"></g>
          <g data-layer="lifts"></g>
          <g data-layer="esc"></g>
          <g data-layer="badges"></g>
          <g id="g-starts"></g>
        </g>
      </svg>
      <div class="layers pro-only" id="layers">
        <button type="button" id="layerbtn" aria-expanded="true" aria-controls="layerbody"><span data-i="layers">Capas</span> <span aria-hidden="true" id="layerarrow">▾</span></button>
        <div class="body" id="layerbody"></div>
      </div>
      <div class="mapctl">
        <button id="zin" type="button">+</button>
        <button id="zout" type="button">−</button>
        <button id="zfit" type="button">⤢</button>
      </div>
      <div class="hint" id="hint" hidden data-i="pickHint"></div>
    </div>
  </div>


  <p class="note foot" id="footnote"></p>
</div>

<script src="data/plan-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
