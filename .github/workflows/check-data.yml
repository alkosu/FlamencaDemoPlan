name: Проверка данных

# Пересобирает data/plan-data.js и export/* из data/complex.json и data/master/*.json
# и проверяет, что в модели есть все апартаменты 1–506.
on:
  push:
    paths: ["data/**", "tools/**"]
  pull_request:
    paths: ["data/**", "tools/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build.py
      - name: Все апартаменты на месте
        run: python -c "import json;s=open('data/plan-data.js',encoding='utf-8').read();d=json.loads(s[s.index('=')+1:].strip().rstrip(';'));n=sorted(u['num'] for u in d['units'] if u['kind']=='apt');assert n==list(range(1,507)),n[:5];print(len(n),'апартаментов')"
